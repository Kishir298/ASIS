# Copy to /etc/systemd/system/core.service.d/pi.conf AFTER mounting the SSD.
[Unit]
RequiresMountsFor=/srv/core
ConditionPathIsMountPoint=/srv/core

[Service]
WorkingDirectory=/srv/core/core
Environment=CORE_WEB_DATA=/srv/core/core/web
Environment=ASIS_DEPLOYMENT_PROFILE=pi
Environment=ASIS_CORE_ENABLED=false
Environment=ASIS_PI_QUEUE_DIRECTORY=/run/risarms-ai
Environment=ASIS_PI_MODEL_MANIFEST=/etc/core/pi-models.json
Environment=ASIS_AI_ENDPOINT=http://127.0.0.1:11434
RuntimeDirectory=risarms-ai
RuntimeDirectoryMode=0700
# Do not use a root-owned /etc/core/core.env to override these SSD paths.
# No public origin/tunnel is configured by this drop-in.
